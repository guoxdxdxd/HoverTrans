name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# softprops/action-gh-release 要写 Release，否则用的是只读的默认 token。
permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-installer.ps1 用 git describe 取版本，浅克隆看不到 tag。
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          Start-Transcript -Path installer-build.log
          try { ./packaging/build-installer.ps1 -Version $env:GITHUB_REF_NAME } finally { Stop-Transcript }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-build-log
          path: installer-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: HoverTrans-installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/installer/*.exe
          # 直接发布，不留在草稿里：应用的「检查更新」读的是 latest release，草稿它看不见。
          draft: false
          generate_release_notes: true

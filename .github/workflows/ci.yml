name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
      - run: dotnet restore HoverTrans.slnx
      - run: dotnet build HoverTrans.slnx -c Release --no-restore
      - run: dotnet test HoverTrans.slnx -c Release --no-build
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        # 不含 llama.cpp 运行时（-SkipRuntime）：CI 只验证安装包能打出来，发布包由 release.yml 带运行时。
        run: ./packaging/build-installer.ps1 -SkipRuntime
      - uses: actions/upload-artifact@v4
        with:
          name: HoverTrans-installer
          path: artifacts/installer/*.exe
          if-no-files-found: error

  cross-platform-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
      - run: dotnet build HoverTrans/HoverTrans.csproj -f net11.0 -c Release

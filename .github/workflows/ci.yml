name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
      - run: dotnet restore HoverTrans.slnx
      - run: dotnet build HoverTrans.slnx -c Release --no-restore
      - run: dotnet test HoverTrans.slnx -c Release --no-build
      - name: Publish self-contained Windows build
        run: >
          dotnet publish HoverTrans/HoverTrans.csproj
          -f net11.0-windows10.0.19041.0
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: HoverTrans-win-x64
          path: artifacts/win-x64

  cross-platform-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
      - run: dotnet build HoverTrans/HoverTrans.csproj -f net11.0 -c Release
